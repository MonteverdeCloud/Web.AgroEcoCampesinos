<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Agroecología Los Campesinos — Muy pronto. Un proyecto de vida que conecta con la tierra." />
  <meta name="robots" content="noindex" />
  <title>Agroecología Los Campesinos — Muy pronto</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="assets/css/paleta.css" />
  <link rel="icon" type="image/png" href="assets/src/logo.png" />

  <style>
    /* Estilos exclusivos de esta página "en construcción" */
    .construccion {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(127, 176, 105, 0.25), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(74, 124, 89, 0.35), transparent 50%),
        linear-gradient(160deg, var(--verde-bosque) 0%, #1e3a28 100%);
      color: var(--crema);
      text-align: center;
      padding: var(--esp-lg) var(--esp-md);
    }

    /* Hojas decorativas en el fondo */
    .construccion::before,
    .construccion::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      pointer-events: none;
    }
    .construccion::before {
      width: 320px; height: 320px;
      top: -80px; left: -80px;
      background: var(--verde-hoja);
      animation: flotar 14s ease-in-out infinite;
    }
    .construccion::after {
      width: 380px; height: 380px;
      bottom: -100px; right: -100px;
      background: var(--ocre);
      opacity: 0.18;
      animation: flotar 18s ease-in-out infinite reverse;
    }

    @keyframes flotar {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(30px, -30px) scale(1.08); }
    }

    .construccion__contenido {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--esp-md);
      max-width: 640px;
      animation: aparecer 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo con el mismo marco del sitio */
    .construccion__logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--verde-tierra);
      border: 4px solid var(--verde-menta);
      box-shadow:
        0 12px 32px rgba(0, 0, 0, 0.45),
        0 0 0 8px rgba(220, 232, 213, 0.12);
      overflow: hidden;
      margin-bottom: var(--esp-sm);
      animation: respirar 4s ease-in-out infinite;
    }

    @keyframes respirar {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.03); }
    }

    .construccion__logo img {
      width: 78%;
      height: 78%;
      object-fit: contain;
    }

    .construccion__marca {
      font-family: var(--fuente-cuerpo);
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--verde-menta);
      opacity: 0.85;
      text-align: center;
    }

    .construccion__titulo {
      font-family: var(--fuente-titulos);
      font-weight: 700;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.15;
      color: var(--crema);
      text-align: center;
      margin-top: var(--esp-xs);
    }

    .construccion__titulo em {
      font-style: italic;
      color: var(--verde-hoja);
    }

    .construccion__texto {
      font-size: clamp(1rem, 2vw, 1.1rem);
      line-height: 1.75;
      color: var(--verde-menta);
      opacity: 0.9;
      text-align: center;
      max-width: 520px;
    }

    /* Indicador tipo "loading" con puntos */
    .construccion__indicador {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: var(--esp-md);
      padding: 0.6rem 1.25rem;
      border-radius: var(--radio-pill);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 0.9rem;
      color: var(--verde-menta);
      font-weight: 500;
    }

    .construccion__punto {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--verde-hoja);
      animation: pulso 1.4s ease-in-out infinite;
    }

    .construccion__punto:nth-child(2) { animation-delay: 0.2s; }
    .construccion__punto:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulso {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50%      { opacity: 1; transform: scale(1.15); }
    }

    /* Pie con redes */
    .construccion__pie {
      position: relative;
      z-index: 2;
      margin-top: var(--esp-xxl);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--esp-md);
      animation: aparecer 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
    }

    .construccion__redes {
      display: flex;
      gap: var(--esp-lg);
    }

    .construccion__redes a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--crema);
      font-size: 1.15rem;
      transition: transform var(--transicion-rapida), background var(--transicion-rapida), color var(--transicion-rapida);
    }

    .construccion__redes a:hover {
      transform: translateY(-4px);
      background: var(--verde-hoja);
      color: var(--verde-bosque);
    }

    .construccion__copyright {
      font-size: 0.8rem;
      color: var(--verde-menta);
      opacity: 0.6;
      text-align: center;
    }

    /* Ajustes móviles */
    @media (max-width: 480px) {
      .construccion__logo {
        width: 88px;
        height: 88px;
        border-width: 3px;
      }
      .construccion__pie {
        margin-top: var(--esp-xl);
      }
      .construccion__redes {
        gap: var(--esp-md);
      }
      .construccion__redes a {
        width: 42px;
        height: 42px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <main class="construccion">

    <div class="construccion__contenido">

      <div class="construccion__logo">
        <img src="assets/src/logo.png" alt="Agroecología Los Campesinos" />
      </div>

      <p class="construccion__marca">Agroecología Los Campesinos</p>

      <h1 class="construccion__titulo">
        Estamos sembrando <em>algo nuevo</em>
      </h1>

      <p class="construccion__texto">
        Nuestro sitio está en construcción. Muy pronto podrás conocer nuestras
        experiencias, hospedarte en la casita campesina y conectar con la tierra
        como nunca antes.
      </p>

      <div class="construccion__indicador">
        <span class="construccion__punto"></span>
        <span class="construccion__punto"></span>
        <span class="construccion__punto"></span>
        <span>Próximamente</span>
      </div>

    </div>

    <div class="construccion__pie">
      <div class="construccion__redes">
        <a href="#" aria-label="WhatsApp">
          <i class="fa-brands fa-whatsapp"></i>
        </a>
        <a href="#" aria-label="Facebook">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="#" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
      </div>

      <p class="construccion__copyright">
        © <span id="anio"></span> Agroecología Los Campesinos · Monteverde, Costa Rica
      </p>
    </div>

  </main>

  <script>
    // Año dinámico
    document.getElementById('anio').textContent = new Date().getFullYear();
  </script>

</body>
</html>
